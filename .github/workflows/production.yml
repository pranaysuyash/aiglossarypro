name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aiglossarypro-api
  ECS_SERVICE: aiglossarypro-api-production
  ECS_CLUSTER: aiglossarypro
  TASK_DEFINITION: aiglossarypro-api

jobs:
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build a docker container and push it to ECR
          docker build -f apps/api/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.TASK_DEFINITION }} --query taskDefinition > task-definition.json
          # Remove fields that shouldn't be in the registration
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .registeredAt, .registeredBy, .compatibilities)' task-definition.json > task-definition-clean.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: api
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-frontend:
    name: Deploy Frontend to S3/CloudFront
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @aiglossarypro/shared run build

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://d1bnbqox1m8zqp.cloudfront.net/api
          VITE_FIREBASE_PROJECT_ID: aiglossarypro
          VITE_FIREBASE_CLIENT_EMAIL: firebase-adminsdk-fbsvc@aiglossarypro.iam.gserviceaccount.com
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: aiglossarypro.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: aiglossarypro.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 449850174939
          VITE_FIREBASE_APP_ID: 1:449850174939:web:08d7973752807207d24bfe
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_GA4_MEASUREMENT_ID: G-PGJ3NP5TR7
          VITE_GA4_ENABLED: true
          VITE_GUMROAD_PRODUCT_URL: https://pranaysuyash.gumroad.com/l/ggczfy
          VITE_GUMROAD_DISCOUNT_URL: https://pranaysuyash.gumroad.com/l/ggczfy/EARLY500
          VITE_GUMROAD_BASE_PRICE: 249
          VITE_GUMROAD_EARLY_BIRD_PRICE: 179
          VITE_PPP_MIN_PRICE: 99
          VITE_PPP_MAX_DISCOUNT: 60
          VITE_PPP_ENABLED: true
          VITE_EARLY_BIRD_SAVINGS: 70
        run: |
          pnpm --filter @aiglossarypro/web run build:prod

      - name: Validate build output (no TSX files)
        run: |
          cd dist/public
          if find . -name "*.tsx" -type f | grep -q .; then
            echo "❌ .tsx files found in bundle:"
            find . -name "*.tsx" -type f
            exit 1
          else
            echo "✅ Bundle clean - no .tsx files found"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Create bucket if it doesn't exist
          aws s3api head-bucket --bucket aiglossarypro-frontend 2>/dev/null || \
            aws s3api create-bucket --bucket aiglossarypro-frontend --region ${{ env.AWS_REGION }}
          
          # Enable static website hosting
          aws s3 website s3://aiglossarypro-frontend/ --index-document index.html --error-document index.html
          
          # Sync files with appropriate cache headers and content types
          aws s3 sync dist/public/ s3://aiglossarypro-frontend/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --content-type "application/javascript" \
            --exclude "*" \
            --include "*.js" \
            --include "*.mjs"
          
          # Sync CSS files
          aws s3 sync dist/public/ s3://aiglossarypro-frontend/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --content-type "text/css" \
            --exclude "*" \
            --include "*.css"
          
          # Sync other assets with cache headers
          aws s3 sync dist/public/ s3://aiglossarypro-frontend/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --exclude "*.js" \
            --exclude "*.mjs" \
            --exclude "*.css"
          
          # Sync HTML and other files with no cache
          aws s3 sync dist/public/ s3://aiglossarypro-frontend/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "*.json" \
            --include "*.xml" \
            --include "*.txt"

      - name: Invalidate CloudFront
        run: |
          # CloudFront distribution ID
          DISTRIBUTION_ID="E2U2I62CTZC9QK"
          
          echo "Invalidating CloudFront distribution: $DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text